<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechLab | Cursos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" th:href="@{/css/app.css}">
<script type="module" th:src="@{/js/app.mjs}"></script></head>
<body><main class="container py-4">
<header class="d-flex flex-wrap justify-content-between align-items-center gap-3">
<h1>Catálogo TechLab</h1>
<form th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary">Cerrar sesión</button></form>
</header>
<p>Consulta los cursos disponibles.</p>
<a class="btn btn-primary mb-3" th:if="${admin}" th:href="@{/courses/new}">Nuevo curso</a>
<label for="filter" class="form-label">Buscar en el catálogo</label>
<input id="filter" class="form-control mb-3" type="search" placeholder="Nombre o categoría">
<p id="count" role="status" aria-live="polite"></p>
<div class="table-responsive"><table class="table table-striped align-middle">
<caption>Listado de cursos y precios en soles</caption>
<thead><tr><th scope="col">Curso</th><th scope="col">Categoría</th><th scope="col">Precio (S/)</th><th scope="col">Acciones</th></tr></thead>
<tbody><tr th:each="c : ${courses}" data-course-row>
<td th:text="${c.name}"></td><td th:text="${c.categoryName}"></td><td th:text="${c.price}"></td>
<td><div th:if="${admin}" class="d-flex flex-wrap gap-2">
<a class="btn btn-sm btn-outline-primary" th:href="@{/courses/{id}/edit(id=${c.id})}">Editar</a>
<form method="post" th:action="@{/courses/{id}/delete(id=${c.id})}" data-confirm="¿Eliminar este curso?">
<button class="btn btn-sm btn-outline-danger">Eliminar</button></form></div></td>
</tr></tbody></table></div></main></body></html>
