<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechLab | Curso</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="container py-4">
<h1 th:text="${courseId == null ? 'Nuevo curso' : 'Editar curso'}"></h1>
<form method="post" th:object="${course}"
 th:action="${courseId == null} ? @{/courses} : @{/courses/{id}/edit(id=${courseId})}">
<div class="mb-3"><label for="name" class="form-label">Nombre</label>
<input class="form-control" th:field="*{name}" required maxlength="120" aria-describedby="nameError">
<p id="nameError" class="text-danger" th:errors="*{name}"></p></div>
<div class="mb-3"><label for="price" class="form-label">Precio en soles</label>
<input class="form-control" th:field="*{price}" type="number" min="0" max="999999.99" step="0.01" required aria-describedby="priceError">
<p id="priceError" class="text-danger" th:errors="*{price}"></p></div>
<div class="mb-3"><label for="categoryId" class="form-label">Categoría</label>
<select class="form-select" th:field="*{categoryId}" required aria-describedby="categoryError">
<option value="">Seleccione</option><option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
</select><p id="categoryError" class="text-danger" th:errors="*{categoryId}"></p></div>
<button class="btn btn-primary">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/courses}">Cancelar</a>
</form></main></body></html>
