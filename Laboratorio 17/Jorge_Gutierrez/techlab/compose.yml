
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: techlab
      MYSQL_USER: techlab
      MYSQL_PASSWORD: ${DB_PASSWORD:?configure DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?configure MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3309:3306"
    volumes:
      - techlab_integrador_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  techlab_integrador_data:
    name: techlab_integrador_mysql_data
