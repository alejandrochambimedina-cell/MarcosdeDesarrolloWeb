<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechLab</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">TechLab</a>
      <a class="btn btn-outline-light btn-sm" href="/portal">Ver catálogo</a>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row align-items-center">
      <div class="col-md-6">
        <h1>Bienvenido a TechLab</h1>
        <p>Portal académico migrado del APF1 a Spring Boot.</p>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#infoModal">
          Acerca del proyecto
        </button>
      </div>
      <div class="col-md-6">
        <img src="assets/img/frontend.webp" class="img-fluid rounded"
             alt="Estudiante desarrollando una interfaz web">
      </div>
    </div>

    <form class="row g-2 mt-4" role="search">
      <div class="col-auto">
        <label for="nombre" class="visually-hidden">Nombre</label>
        <input type="text" id="nombre" class="form-control" placeholder="Tu nombre">
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-secondary">Saludar</button>
      </div>
    </form>
  </main>

  <div class="modal fade" id="infoModal" tabindex="-1" aria-labelledby="infoModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="infoModalLabel">Acerca de TechLab</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          Proyecto académico incremental de Marcos de Desarrollo Web (UTP).
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
