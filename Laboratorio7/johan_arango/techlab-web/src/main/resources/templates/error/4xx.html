<!doctype html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Solicitud no válida')}">
</head>

<body class="d-flex flex-column min-vh-100">

<header th:replace="~{fragments/layout :: cabecera}">
</header>

<main class="container py-5">

    <h1>
        No se pudo completar la solicitud
    </h1>

    <p>
        Código:
        <span th:text="${status}">
            400
        </span>
    </p>

    <p>
        Ruta:
        <code th:text="${path}">
            /cursos/999
        </code>
    </p>

    <a class="btn btn-primary"
       th:href="@{/cursos}">
        Volver al catálogo
    </a>

</main>

<footer th:replace="~{fragments/layout :: pie}">
</footer>

</body>

</html>
