<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(#{curso.lista.titulo})}">
</head>

<body>

<a class="visually-hidden-focusable position-absolute top-0 start-0 p-2 bg-white"
   href="#contenido">
    Ir al contenido
</a>

<header th:replace="~{fragments/layout :: cabecera}"></header>

<main id="contenido" class="container py-5">

    <div class="mb-4">
        <h1 th:text="#{curso.lista.titulo}">
            Catálogo de cursos
        </h1>

        <p class="lead">
            Vista dinámica generada en el servidor con Spring MVC y Thymeleaf.
        </p>
    </div>

    <section class="mb-4" aria-labelledby="titulo-busqueda">

        <h2 id="titulo-busqueda" class="h4"
            th:text="#{curso.buscar}">
            Buscar cursos
        </h2>

        <form th:action="@{/cursos}" method="get"
              class="row g-2">

            <div class="col-md-8">
                <label for="q" class="form-label">
                    <span th:text="#{curso.buscar}">
                        Buscar cursos
                    </span>
                </label>

                <input
                    id="q"
                    name="q"
                    type="search"
                    class="form-control"
                    maxlength="60"
                    th:value="${q}"
                    th:placeholder="#{curso.buscar.placeholder}">
            </div>

            <div class="col-md-auto d-flex align-items-end">
                <button type="submit"
                        class="btn btn-primary"
                        th:text="#{accion.buscar}">
                    Buscar
                </button>
            </div>

            <div class="col-md-auto d-flex align-items-end">
                <a th:href="@{/cursos}"
                   class="btn btn-outline-secondary"
                   th:text="#{accion.limpiar}">
                    Limpiar
                </a>
            </div>

        </form>
    </section>

    <section aria-live="polite">

        <p class="mb-4"
           th:text="#{curso.resultados(${#lists.size(cursos)})}">
            3 curso(s) encontrado(s)
        </p>

        <div th:if="${#lists.isEmpty(cursos)}"
             class="alert alert-warning">
            No se encontraron cursos.
        </div>

        <div th:unless="${#lists.isEmpty(cursos)}"
             class="row g-4">

            <div class="col-md-6 col-lg-4"
                 th:each="curso : ${cursos}">

                <article class="card course-card h-100 shadow-sm">

                    <div class="card-body d-flex flex-column">

                        <h2 class="card-title h4"
                            th:text="${curso.titulo}">
                            HTML y CSS
                        </h2>

                        <p class="card-text">
                            <strong th:text="#{curso.horas}">
                                Horas
                            </strong>:
                            <span th:text="${curso.horas}">
                                12
                            </span>
                        </p>

                        <a class="btn btn-outline-primary mt-auto"
                           th:href="@{/cursos/{id}(id=${curso.id})}"
                           th:text="#{curso.ver}">
                            Ver detalle
                        </a>

                    </div>

                </article>

            </div>

        </div>

    </section>

</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>

</body>
</html>
