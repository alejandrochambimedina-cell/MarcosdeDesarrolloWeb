<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${titulo} + ' | ' + #{app.nombre}">
        TechLab Web
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/site.css}">
</head>

<body>  

<header th:fragment="cabecera">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/cursos}">
                <span th:text="#{app.nombre}">TechLab Web</span>
            </a>

            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/cursos}">
                    <span th:text="#{nav.cursos}">Cursos</span>
                </a>

                <a class="nav-link" th:href="@{/api/v1/cursos}">
                    <span th:text="#{nav.api}">API JSON</span>
                </a>
            </div>
        </div>
    </nav>
</header>

<footer th:fragment="pie" class="mt-5 py-4 border-top">
    <div class="container text-center text-muted">
        <span th:text="#{app.nombre}">TechLab Web</span>
        · 2026
    </div>
</footer>

</body>
</html>
