<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Error')}">
</head>

<body>

<header th:replace="~{fragments/layout :: cabecera}"></header>

<main class="container py-5">

    <div class="detail-panel mx-auto text-center">

        <h1 class="display-4"
            th:text="${status}">
            404
        </h1>

        <h2>La página solicitada no está disponible.</h2>

        <p class="text-muted">
            <strong>Ruta:</strong>
            <span th:text="${path}">/cursos/999</span>
        </p>

        <p th:if="${message}"
           th:text="${message}">
            Curso no encontrado
        </p>

        <a th:href="@{/cursos}"
           class="btn btn-primary">
            Volver al catálogo
        </a>

    </div>

</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>

</body>
</html>
