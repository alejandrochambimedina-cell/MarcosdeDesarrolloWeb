spring.application.name=techlab
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/techlab?serverTimezone=UTC}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Configuracion de seguridad
app.security.demo-username=${APP_DEMO_USERNAME:docente}
app.security.demo-password=${APP_DEMO_PASSWORD}

# Configuracion de sesiones
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m