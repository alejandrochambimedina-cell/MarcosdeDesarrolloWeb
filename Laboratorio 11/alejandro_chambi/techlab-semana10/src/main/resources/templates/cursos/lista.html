<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Catálogo de cursos')}"><meta charset="UTF-8"><title>Catálogo de cursos</title></head>
<body class="d-flex flex-column min-vh-100"><header th:replace="~{fragments/layout :: cabecera}"></header>
<main id="contenido" class="container py-5">
 <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4"><div><p class="text-primary fw-semibold mb-1">TechLab Web</p><h1 class="display-5 fw-bold">Catálogo de cursos</h1><p class="text-secondary">Administra cursos y sus categorías.</p></div><a class="btn btn-primary" th:href="@{/cursos/nuevo}">Nuevo curso</a></div>
 <div class="alert alert-success" role="status" th:if="${mensaje}" th:text="${mensaje}"></div>
 <form class="row g-3 align-items-end mb-4" method="get" th:action="@{/cursos}">
  <div class="col-md-5"><label for="q" class="form-label">Buscar por título</label><input id="q" class="form-control" name="q" th:value="${q}" maxlength="60" placeholder="Ej. Spring Boot"></div>
  <div class="col-md-4"><label for="categoriaId" class="form-label">Categoría</label><select id="categoriaId" class="form-select" name="categoriaId"><option value="">Todas las categorías</option><option th:each="categoria : ${categorias}" th:value="${categoria.id()}" th:text="${categoria.nombre()}" th:selected="${categoria.id() == categoriaId}">Front-end</option></select></div>
  <div class="col-md-3 d-flex gap-2"><button class="btn btn-outline-primary" type="submit">Filtrar</button><a class="btn btn-outline-secondary" th:href="@{/cursos}">Limpiar</a></div>
 </form>
 <p class="text-body-secondary" th:text="|${#lists.size(cursos)} curso(s) encontrado(s)|">3 cursos encontrados</p>
 <div class="alert alert-info" role="status" th:if="${#lists.isEmpty(cursos)}">No se encontraron cursos. Pruebe con otro término o categoría.</div>
 <div class="row g-4" th:unless="${#lists.isEmpty(cursos)}"><div class="col-md-6 col-xl-4" th:each="curso : ${cursos}"><article class="card course-card h-100 shadow-sm"><div class="card-body d-flex flex-column"><div class="d-flex justify-content-between gap-2 mb-2"><span class="text-body-secondary">Código <span th:text="${curso.id()}">1</span></span><span class="badge text-bg-secondary" th:text="${curso.categoriaNombre()}">Front-end</span></div><h2 class="h4 card-title" th:text="${curso.titulo()}">HTML y CSS</h2><p class="card-text"><span th:text="${curso.horas()}">12</span> horas</p><div class="d-flex flex-wrap gap-2 mt-auto"><a class="btn btn-outline-primary" th:href="@{/cursos/{id}(id=${curso.id()})}">Ver</a><a class="btn btn-outline-secondary" th:href="@{/cursos/{id}/editar(id=${curso.id()})}">Editar</a><form method="post" th:action="@{/cursos/{id}/eliminar(id=${curso.id()})}" onsubmit="return confirm('¿Eliminar este curso?')"><button class="btn btn-outline-danger" type="submit">Eliminar</button></form></div></div></article></div></div>
</main><footer th:replace="~{fragments/layout :: pie}"></footer></body></html>
