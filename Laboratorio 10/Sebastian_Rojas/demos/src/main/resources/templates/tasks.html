<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de tareas</title>
</head>

<body>

    <h1>Lista de tareas</h1>

    <ul>
        <li th:each="task : ${tasks}">
            <span th:text="${task.title}"></span>
            -
            <span th:text="${task.completed ? 'Completada' : 'Pendiente'}"></span>
        </li>
    </ul>

</body>

</html>
