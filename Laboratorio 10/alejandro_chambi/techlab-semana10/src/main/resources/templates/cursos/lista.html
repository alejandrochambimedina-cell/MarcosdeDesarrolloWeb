<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Catálogo de cursos')}"></head><body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: cabecera}"></header><main class="container py-4"><div class="d-flex justify-content-between align-items-end mb-4"><div><p class="text-primary fw-semibold">Semana 10</p><h1 class="display-6 fw-bold">Catálogo de cursos</h1><p class="lead">CRUD web y REST respaldado por MySQL.</p></div><a class="btn btn-primary" th:href="@{/cursos/nuevo}">Nuevo curso</a></div>
<div class="alert alert-success" role="status" th:if="${mensaje}" th:text="${mensaje}"></div><form class="row g-3 mb-4" method="get" th:action="@{/cursos}"><div class="col-md-8"><label class="form-label" for="q">Buscar cursos</label><input class="form-control" id="q" name="q" type="search" maxlength="60" th:value="${q}" placeholder="Ejemplo: Spring"></div><div class="col-md-4"><button class="btn btn-primary">Buscar</button> <a class="btn btn-outline-secondary" th:if="${!#strings.isEmpty(q)}" th:href="@{/cursos}">Limpiar</a></div></form>
<p th:text="|${#lists.size(cursos)} curso(s) encontrado(s)|"></p><div class="alert alert-info" th:if="${#lists.isEmpty(cursos)}">No se encontraron cursos.</div><div class="row g-4" th:unless="${#lists.isEmpty(cursos)}"><div class="col-md-6 col-xl-4" th:each="curso : ${cursos}"><article class="card course-card h-100 shadow-sm"><div class="card-body d-flex flex-column"><p class="text-secondary">Código <span th:text="${curso.id}"></span></p><h2 class="h4" th:text="${curso.titulo}"></h2><p><span th:text="${curso.horas}"></span> horas</p><div class="d-flex flex-wrap gap-2 mt-auto"><a class="btn btn-outline-primary" th:href="@{/cursos/{id}(id=${curso.id})}">Ver</a><a class="btn btn-outline-secondary" th:href="@{/cursos/{id}/editar(id=${curso.id})}">Editar</a><form method="post" th:action="@{/cursos/{id}/eliminar(id=${curso.id})}" data-confirm-delete th:attr="data-course-title=${curso.titulo}"><button class="btn btn-outline-danger">Eliminar</button></form></div></div></article></div></div></main><footer th:replace="~{fragments/layout :: pie}"></footer></body></html>
