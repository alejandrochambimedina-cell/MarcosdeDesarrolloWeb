<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Detalle del curso')}"></head><body class="d-flex flex-column min-vh-100"><header th:replace="~{fragments/layout :: cabecera}"></header><main class="container py-5"><section class="detail-panel mx-auto" th:object="${curso}"><div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div><p class="text-primary fw-semibold">Detalle del curso</p><h1 class="display-6 fw-bold" th:text="*{titulo}">Curso</h1><dl class="row mt-4"><dt class="col-sm-4">Código</dt><dd class="col-sm-8" th:text="*{id}"></dd><dt class="col-sm-4">Horas</dt><dd class="col-sm-8" th:text="|*{horas} horas|"></dd><dt class="col-sm-4">Versión</dt><dd class="col-sm-8" th:text="*{version}"></dd></dl><a class="btn btn-primary" th:href="@{/cursos/{id}/editar(id=${curso.id})}">Editar</a> <a class="btn btn-outline-secondary" th:href="@{/cursos}">Volver al catálogo</a><form class="d-inline" method="post" th:action="@{/cursos/{id}/eliminar(id=${curso.id})}" data-confirm-delete th:attr="data-course-title=${curso.titulo}"><button class="btn btn-outline-danger">Eliminar</button></form></section></main><footer th:replace="~{fragments/layout :: pie}"></footer></body></html>
