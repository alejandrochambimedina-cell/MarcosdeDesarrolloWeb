<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head(${tituloPagina})}"></head><body class="d-flex flex-column min-vh-100"><header th:replace="~{fragments/layout :: cabecera}"></header><main class="container py-5"><section class="form-panel mx-auto"><p class="text-primary fw-semibold">Gestión del catálogo</p><h1 class="display-6 fw-bold" th:text="${tituloPagina}">Nuevo curso</h1><p class="text-secondary">Los datos se verifican también en el servidor.</p><div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div><form method="post" th:object="${form}" th:action="${cursoId == null} ? @{/cursos} : @{/cursos/{id}(id=${cursoId})}"><div class="mb-3"><label class="form-label" for="titulo">Título</label><input class="form-control" id="titulo" th:field="*{titulo}" required maxlength="120"><div class="form-text">Nombre único de hasta 120 caracteres.</div></div><div class="mb-4"><label class="form-label" for="horas">Horas</label><input class="form-control" id="horas" type="number" th:field="*{horas}" required min="1" max="500"><div class="form-text">Valor entero entre 1 y 500.</div></div><input type="hidden" th:field="*{version}"><button class="btn btn-primary" th:text="${textoBoton}">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/cursos}">Cancelar</a></form></section></main><footer th:replace="~{fragments/layout :: pie}"></footer></body></html>
