<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Iniciar sesión | RutaPerú', 'auth.css')}"></head>

<body>

    <header th:replace="~{fragments/layout :: header('login')}"></header>

    <main class="container auth-main">

        <section class="auth-card">

            <div class="auth-titulo">
                <span>BIENVENIDO</span>
                <h1>Iniciar sesión</h1>
                <p>Ingresa a tu cuenta para reservar tu pasaje.</p>
            </div>

            <!-- Mensajes del servidor (Thymeleaf) -->
            <div class="alert alert-info" th:if="${aviso}" th:text="${aviso}"></div>
            <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" class="form-control"
                           placeholder="ejemplo@correo.com" th:value="${correo}" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="clave" class="form-label">Contraseña</label>
                    <input type="password" id="clave" name="clave" class="form-control"
                           placeholder="Tu contraseña" required>
                </div>

                <button type="submit" class="btn btn-auth w-100">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Iniciar sesión
                </button>

            </form>

            <p class="auth-alterno">
                ¿Aún no tienes cuenta?
                <a th:href="@{/registro}">Regístrate aquí</a>
            </p>

        </section>

    </main>

    <th:block th:replace="~{fragments/layout :: footer}"></th:block>

</body>

</html>
