<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Registrarse | RutaPerú', 'auth.css')}"></head>

<body>

    <header th:replace="~{fragments/layout :: header('registro')}"></header>

    <main class="container auth-main">

        <section class="auth-card">

            <div class="auth-titulo">
                <span>CREA TU CUENTA</span>
                <h1>Registrarse</h1>
                <p>Regístrate gratis para reservar y guardar tus viajes.</p>
            </div>

            <!-- Errores de validación enviados por el servidor -->
            <div class="alert alert-danger" th:if="${errores}">
                <ul class="mb-0">
                    <li th:each="mensaje : ${errores}" th:text="${mensaje}"></li>
                </ul>
            </div>

            <form th:action="@{/registro}" method="post">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="nombres" class="form-label">Nombres</label>
                        <input type="text" id="nombres" name="nombres" class="form-control"
                               placeholder="Ej. Juan Carlos" th:value="${nombres}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="apellidos" class="form-label">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" class="form-control"
                               placeholder="Ej. Pérez García" th:value="${apellidos}" required>
                    </div>

                    <div class="col-12">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" class="form-control"
                               placeholder="ejemplo@correo.com" th:value="${correo}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="clave" class="form-label">Contraseña</label>
                        <input type="password" id="clave" name="clave" class="form-control"
                               placeholder="Mínimo 6 caracteres" minlength="6" required>
                    </div>

                    <div class="col-md-6">
                        <label for="confirmarClave" class="form-label">Confirmar contraseña</label>
                        <input type="password" id="confirmarClave" name="confirmarClave"
                               class="form-control" placeholder="Repite tu contraseña" minlength="6" required>
                    </div>

                </div>

                <button type="submit" class="btn btn-auth w-100 mt-4">
                    <i class="fa-solid fa-user-plus"></i>
                    Crear cuenta
                </button>

            </form>

            <p class="auth-alterno">
                ¿Ya tienes cuenta?
                <a th:href="@{/login}">Inicia sesión</a>
            </p>

        </section>

    </main>

    <th:block th:replace="~{fragments/layout :: footer}"></th:block>

</body>

</html>
