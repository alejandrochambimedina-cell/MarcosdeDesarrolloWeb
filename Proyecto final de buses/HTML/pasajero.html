<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Datos del Pasajero | RutaPerú</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- CSS de tu proyecto -->
    <link rel="stylesheet" href="../CSS/estilo_global.css">
    <link rel="stylesheet" href="../CSS/pasajero.css">
</head>

<body>

    <!-- MENÚ -->
    <header class="header">

        <div class="navbar container">

            <div class="logo">
                <img src="../imagenes/ruta-logo.png"
                     alt="Logo RutaPerú">
            </div>

            <nav class="menu">

                <ul>
                    <li>
                        <a href="inicio.html">Inicio</a>
                    </li>

                    <li>
                        <a href="buses.html">Buses</a>
                    </li>

                    <li>
                        <a href="reserva.html">Reserva</a>
                    </li>

                    <li>
                        <a href="servicios.html">Servicios</a>
                    </li>

                    <li>
                        <a href="pasajero.html" class="activo">
                            Pasajero
                        </a>
                    </li>

                    <li>
                        <a href="boleto.html">Boleto</a>
                    </li>
                </ul>

            </nav>

        </div>

    </header>


    <!-- FORMULARIO -->
    <main class="container pasajero-main">

        <section class="pasajero-card">

            <div class="pasajero-titulo">

                <span>DATOS DEL PASAJERO</span>

                <h1>
                    Completa tus datos
                </h1>

                <p>
                    Ingresa la información necesaria
                    para registrar al pasajero.
                </p>

            </div>


            <form id="formPasajero">

                <div class="row g-4">

                    <!-- NOMBRES -->
                    <div class="col-md-6">

                        <label for="nombres"
                               class="form-label">
                            Nombres *
                        </label>

                        <input type="text"
                               id="nombres"
                               name="nombres"
                               class="form-control"
                               placeholder="Ej. Juan Carlos"
                               required>

                    </div>


                    <!-- APELLIDOS -->
                    <div class="col-md-6">

                        <label for="apellidos"
                               class="form-label">
                            Apellidos *
                        </label>

                        <input type="text"
                               id="apellidos"
                               name="apellidos"
                               class="form-control"
                               placeholder="Ej. Pérez García"
                               required>

                    </div>


                    <!-- DNI -->
                    <div class="col-md-6">

                        <label for="dni"
                               class="form-label">
                            DNI *
                        </label>

                        <input type="text"
                               id="dni"
                               name="dni"
                               class="form-control"
                               placeholder="8 dígitos"
                               maxlength="8"
                               pattern="[0-9]{8}"
                               required>

                    </div>


                    <!-- FECHA -->
                    <div class="col-md-6">

                        <label for="fechaNacimiento"
                               class="form-label">
                            Fecha de nacimiento *
                        </label>

                        <input type="date"
                               id="fechaNacimiento"
                               name="fechaNacimiento"
                               class="form-control"
                               required>

                    </div>


                    <!-- SEXO -->
                    <div class="col-md-6">

                        <label for="sexo"
                               class="form-label">
                            Sexo *
                        </label>

                        <select id="sexo"
                                name="sexo"
                                class="form-select"
                                required>

                            <option value="">
                                Selecciona una opción
                            </option>

                            <option value="Femenino">
                                Femenino
                            </option>

                            <option value="Masculino">
                                Masculino
                            </option>

                            <option value="Otro">
                                Otro
                            </option>

                            <option value="No especificar">
                                Prefiero no indicar
                            </option>

                        </select>

                    </div>


                    <!-- TELÉFONO -->
                    <div class="col-md-6">

                        <label for="telefono"
                               class="form-label">
                            Teléfono *
                        </label>

                        <input type="tel"
                               id="telefono"
                               name="telefono"
                               class="form-control"
                               placeholder="Ej. 987654321"
                               maxlength="9"
                               pattern="[0-9]{9}"
                               required>

                    </div>


                    <!-- CORREO -->
                    <div class="col-12">

                        <label for="correo"
                               class="form-label">
                            Correo electrónico *
                        </label>

                        <input type="email"
                               id="correo"
                               name="correo"
                               class="form-control"
                               placeholder="ejemplo@correo.com"
                               required>

                    </div>


                    <!-- CONTACTO DE EMERGENCIA -->
                    <div class="col-12">

                        <label for="emergencia"
                               class="form-label">
                            Contacto de emergencia
                        </label>

                        <input type="text"
                               id="emergencia"
                               name="emergencia"
                               class="form-control"
                               placeholder="Nombre y teléfono">

                    </div>


                    <!-- CONFIRMACIÓN -->
                    <div class="col-12">

                        <div class="form-check">

                            <input type="checkbox"
                                   id="acepto"
                                   class="form-check-input"
                                   required>

                            <label for="acepto"
                                   class="form-check-label">

                                Confirmo que los datos
                                ingresados son correctos.

                            </label>

                        </div>

                    </div>

                </div>


                <!-- BOTONES -->
                <div class="form-acciones mt-4">

                    <a href="reserva.html"
                       class="btn btn-secondary">

                        <i class="fa-solid fa-arrow-left"></i>

                        Volver

                    </a>


                    <button type="submit"
                            class="btn btn-primary">

                        <i class="fa-solid fa-user-check"></i>

                        Guardar pasajero

                    </button>

                </div>

            </form>


            <!-- MENSAJE -->
            <div id="mensajeExito"
                 class="alert alert-success mt-4 d-none">

            </div>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer class="footer">

        <div class="container">

            <h3>RutaPerú</h3>

            <p>
                Viaja con comodidad,
                seguridad y confianza.
            </p>

        </div>

        <div class="footer-bottom">

            © 2026 RutaPerú - Todos los derechos reservados

        </div>

    </footer>


    <!-- JavaScript -->
    <script src="../JS/pasajero.js"></script>

</body>

</html>
