<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de usuarios</title>
</head>

<body>
        <nav>
        <a href="/cursos">Cursos</a> |
        <a href="/cursos/resumen">Resumen</a> |
        <a href="/users">Usuarios</a> |
        <a href="/tasks">Tareas</a>
    </nav>

    <div>
        <span th:if="${isAuthenticated}">
            Sesión iniciada como:
            <strong th:text="${currentUsername}"></strong>

            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit">Cerrar sesión</button>
            </form>
        </span>

        <span th:unless="${isAuthenticated}">
            <a th:href="@{/login}">Iniciar sesión</a>
        </span>
    </div>

    <h1>Lista de usuarios</h1>

    <ul>
        <li th:each="user : ${users}">
            <strong th:text="${user.name}"></strong>
            -
            <span th:text="${user.email}"></span>
        </li>
    </ul>

</body>

</html>
